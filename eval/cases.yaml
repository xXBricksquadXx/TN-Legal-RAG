# Existing Baseline Cases
- id: tca-records-act
  q: Who is the custodian of records under 10-7-503?
  topic: sunshine
  expect_contains_any: ["custodian", "public official"]
  expect_sources_any: ["docs/tn/code/tca-10-7-503-public-records-act.md"]

- id: bar-404b-distinction
  q: What is the TN standard for clear and convincing evidence in 404b?
  topic: bar
  expect_contains_any: ["clear and convincing", "material issue"]
  expect_sources_any: ["docs/tn/bar/distinctions/evidence/tn-v-mbe-evidence-404b.md"]

- id: confidentiality-exceptions
  q: Are investigative files of the TBI confidential?
  topic: sunshine
  expect_contains_any: ["confidential", "TBI", "10-7-504"]
  expect_sources_any: 
    - "docs/tn/code/tca-10-7-504-confidential-records-exceptions.md"
    - "docs/tn/sunshine/public-records-act-quickref-2025.md"

- id: budget-fy25
  q: What is the total budget for the fiscal year?
  topic: budget
  expect_contains_any: ["billion", "General Fund"]
  expect_sources_any: ["docs/tn/budget/state-budget-2025-vol1.md"]

