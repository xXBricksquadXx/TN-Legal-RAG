# --- SUNSHINE & PUBLIC RECORDS ---
- id: tca-records-act
  q: "Who is the custodian of records under 10-7-503?"
  topic: "sunshine"
  expect_contains_any: ["custodian", "public official"]
  expect_sources_any: 
    - "docs/tn/code/tca-10-7-503-public-records-act.md"
    - "docs/tn/sunshine/public-records-act-quickref-2025.md"

- id: confidentiality-exceptions
  q: "Are investigative files of the TBI confidential under 10-7-504?"
  topic: "sunshine"
  expect_contains: "confidential"
  expect_contains_any: ["TBI", "investigative"]
  expect_sources_any: ["docs/tn/code/tca-10-7-504-confidential-records-exceptions.md"]

- id: toma-secret-ballots
  q: "Can a county commission use secret ballots to vote on a controversial zoning resolution?"
  topic: "sunshine"
  expect_contains: "prohibited"
  expect_contains_any: ["secret votes", "secret ballots"]
  expect_sources_any: ["docs/tn/code/tca-8-44-104-minutes-recorded.md"]

- id: toma-action-nullified
  q: "What is the legal consequence if a board takes action at a meeting without giving adequate public notice under 8-44-105?"
  topic: "sunshine"
  expect_contains_any: ["void", "nullified", "no effect"]
  expect_sources_any: ["docs/tn/code/tca-8-44-105-action-nullified.md"]

- id: tpra-attorney-fees
  q: "Can a court award attorney's fees if a county willfully denies a public records request?"
  topic: "sunshine"
  expect_contains_any: ["yes", "attorneys' fees", "reasonable costs"]
  expect_sources_any: ["docs/tn/code/tca-10-7-505-denial-of-access.md"]

- id: tpra-commercial-value-news
  q: "Are news media required to pay commercial value development fees for GIS maps?"
  topic: "sunshine"
  expect_contains_any: ["exempt", "cost of reproduction", "news gathering"]
  expect_sources_any: ["docs/tn/code/tca-10-7-506-inspect-public-records.md"]

